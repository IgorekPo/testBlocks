<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Перелистывание папируса</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="book">
      <section class="page-stage" data-paper="./images/papyrus-beige.webp">
        <div class="page-scene">
          <div class="page__content">
            <h1>Страница 1</h1>
            <p>Содержимое первого блока.</p>
          </div>
        </div>
      </section>

      <section class="page-stage" data-paper="./images/papyrus-green-beige.webp">
        <div class="page-scene">
          <div class="page__content">
            <h1>Страница 2</h1>
            <p>Содержимое второго блока.</p>
          </div>
        </div>
      </section>

      <section class="page-stage" data-paper="./images/papyrus-beige.webp">
        <div class="page-scene">
          <div class="page__content">
            <h1>Страница 3</h1>
            <p>Содержимое третьего блока.</p>
          </div>
        </div>
      </section>

      <section class="page-stage" data-paper="./images/papyrus-green-beige.webp">
        <div class="page-scene">
          <div class="page__content">
            <h1>Страница 4</h1>
            <p>Содержимое четвёртого блока.</p>
          </div>
        </div>
      </section>

      <section class="page-stage" data-paper="./images/papyrus-beige.webp">
        <div class="page-scene">
          <div class="page__content">
            <h1>Страница 5</h1>
            <p>Содержимое пятого блока.</p>
          </div>
        </div>
      </section>

      <section class="page-stage" data-paper="./images/papyrus-green-beige.webp">
        <div class="page-scene">
          <div class="page__content">
            <h1>Страница 6</h1>
            <p>Содержимое шестого блока.</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Прозрачный слой для WebGL-листа. Он находится над содержимым страниц. -->
    <canvas id="page-turn" aria-hidden="true"></canvas>

    <!-- Three.js используется как ES-модуль: подключать script.js второй раз нельзя. -->
    <script type="module" src="./script.js"></script>
  </body>
</html>
